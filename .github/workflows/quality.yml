name: Quality
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check game.js && node --check v4.js && node --check sw.js
      - name: Required PWA and SEO files
        run: test -s index.html && test -s manifest.webmanifest && test -s robots.txt && test -s sitemap.xml
